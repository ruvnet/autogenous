[package]
name = "midstream-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Autogenous stream-observation adapter: raw LLM/agent stream chunks + armed antibodies -> structured incidents with derived evidence (ADR-393 MVP component 2)."

[dependencies]
agl-types = { path = "../agl-types" }
antibody = { path = "../antibody" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# REAL midstream (ruvnet/midstream, MIT/Apache, edition 2021): temporal sequence
# comparison (DTW / edit-distance / LCS) — catches reordered/obfuscated attacks
# that substring detectors miss. Published on crates.io.
midstreamer-temporal-compare = "0.2.1"

[dev-dependencies]
evaluator = { path = "../evaluator" }
promotion = { path = "../promotion" }
